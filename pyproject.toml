[project]
name = "h1-polymarket"
version = "0.1.0"
description = "Pre-registered Stage 1 gate test of H1-revised: long-horizon NO-side edge in Polymarket politics markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.4",
    "eth-abi>=5.2.0",
    "eth-utils>=6.0.0",
    "httpx>=0.28.1",
    "hypersync>=1.2.0",
    "polars>=1.42.1",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
